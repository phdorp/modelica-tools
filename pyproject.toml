[project]
name = "modelica-tools"
version = "0.1.0"
description = "A set of tools for working with Modelica models"
readme = "README.md"
requires-python = ">=3.11"
# hydra-core 1.3.7 rejects declarative instantiation of hydra._internal BasicSweeper,
# which hydra_zen.launch() needs for multirun; cap until hydra-zen supports it.
dependencies = ["hydra-zen~=0.16.0", "hydra-core>=1.3.2,<1.3.7", "pandas~=3.0.2", "numpy~=2.4.6", "dash~=4.1.0"]

[project.optional-dependencies]
dev = ["mypy~=1.20.0", "pytest~=9.0.2", "isort~=8.0.1", "pandas-stubs~=3.0.0", "plotly-stubs~=0.1.3"]
testing = ["pytest~=9.0.2", "numpy~=2.4.6"]

[tool.uv.workspace]
members = [
    "examples",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtools"]

# `src/mtools` and `tests` are implicit namespace packages (no `__init__.py`),
# so mypy needs the package roots declared to map paths to module names instead
# of seeing e.g. `mtools/sim_tools.py` and `mtools/internal/sim_tools.py` both
# as top-level `sim_tools`. `tests/session_tools` is listed as a root because
# the tests import the Modelica fixtures as `models.kinematic_vehicle`.
[tool.mypy]
mypy_path = ["src", "tests/session_tools"]
namespace_packages = true
explicit_package_bases = true
