[project]
name = "examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "modelica-tools[fmu]",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=9.0.0", "pandas>=3.0.0"]

[tool.uv.sources]
modelica-tools = { workspace = true }

# Its own pytest section keeps the examples suite from picking up the root
# project's pytest settings when run from `examples/`.
[tool.pytest.ini_options]
testpaths = ["tests"]
